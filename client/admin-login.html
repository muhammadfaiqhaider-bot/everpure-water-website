<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EverPure Admin Portal</title>
    <link rel="stylesheet" href="css/admin-login.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="bg-orb orb-one"></div>
      <div class="bg-orb orb-two"></div>
      <div class="bg-grid"></div>

      <main class="login-card" aria-labelledby="portal-title">
        <div class="brand-mark">
          <img src="assets/logo/logo.png" alt="EverPure Water Plant logo" />
        </div>

        <div class="card-header">
          <p class="eyebrow">Secure access</p>
          <h1 id="portal-title">EverPure Admin Portal</h1>
          <p class="subtitle">Authorized Personnel Only</p>
        </div>

        <form id="loginForm" class="login-form" novalidate>
          <label class="field-group" for="username">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-3.33 0-6 1.79-6 4v1h12v-1c0-2.21-2.67-4-6-4Z" />
              </svg>
            </span>
            <input id="username" name="username" type="text" placeholder="Username" autocomplete="username" required />
          </label>

          <label class="field-group password-group" for="password">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M17 9V7A5 5 0 0 0 7 7v2H5v10h14V9Zm-8-2a3 3 0 1 1 6 0v2H9Zm7 10H8v-6h8Z" />
              </svg>
            </span>
            <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required />
            <button class="password-toggle" type="button" aria-label="Show password">
              <svg viewBox="0 0 24 24">
                <path d="M12 5c5.2 0 9.4 3.6 10.8 8.5-.4 1.1-1 2.2-1.8 3.1L20 18l-1.4 1.4-1.8-1.8A11.4 11.4 0 0 1 12 19c-5.2 0-9.4-3.6-10.8-8.5.4-1.1 1-2.2 1.8-3.1L4 6l1.4-1.4 1.8 1.8A11.4 11.4 0 0 1 12 5Zm0 2.5A6.5 6.5 0 0 0 5.5 14 6.5 6.5 0 0 0 18.5 14 6.5 6.5 0 0 0 12 7.5Zm0 2A4.5 4.5 0 0 1 16.5 14 4.5 4.5 0 0 1 7.5 14 4.5 4.5 0 0 1 12 9.5Z" />
              </svg>
            </button>
          </label>

          <div class="form-options">
            <label class="remember-me" for="rememberMe">
              <input id="rememberMe" type="checkbox" name="remember" />
              <span class="checkmark"></span>
              <span>Remember Me</span>
            </label>
            <a class="support-link" href="index.html">Return to site</a>
          </div>

          <button id="loginBtn" class="login-btn" type="submit">
            <span class="btn-text">Sign In</span>
            <span class="btn-loader" aria-hidden="true"></span>
          </button>

          <div id="loginMessage" class="message" role="status" aria-live="polite"></div>
        </form>
      </main>
    </div>
  </body>
</html>
